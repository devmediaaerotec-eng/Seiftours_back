
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:

services:
    # Default configuration for services
    _defaults:
        autowire: true
        autoconfigure: true

    # Automatically register classes in src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Unidev GPS API configuration
    App\Command\SyncUnidevPositionsCommand:
        arguments:
            $baseUrl: '%env(UNIDEV_BASE_URL)%'
            $token: '%env(UNIDEV_TOKEN)%'
